plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
}

group = 'dev.hopperspeed'
version = '1.0.0'
base.archivesName = 'hopperspeed-forge-1.21.8'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.8'
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            // Carrega o mixin no ambiente de desenvolvimento.
            args '--mixin.config=hopperspeed.mixins.json'
        }
        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', 'hopperspeed'
        }
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.8-58.1.26')
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    manifest {
        attributes 'MixinConfigs': 'hopperspeed.mixins.json'
    }
}
